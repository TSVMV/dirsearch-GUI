[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dirsearchx"
version = "0.1.0"
description = "Three-surface (GUI / CLI) launcher around an unmodified dirsearch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "dirsearchx" }]
keywords = ["dirsearch", "gui", "cli", "security", "pentest", "dirbuster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
dirsearch-gui = "dirsearchx.gui.app:main"
dirsearch-cli = "dirsearchx.cli.passthrough:main"

[tool.setuptools]
packages = ["dirsearchx", "dirsearchx.core", "dirsearchx.cli", "dirsearchx.gui"]
